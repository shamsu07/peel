# App icon: the Peel sticker logo. Sources live in ../design/brand/source;
# regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  # iOS icons (light, dark, tinted) are set by hand in
  # ios/Runner/Assets.xcassets/AppIcon.appiconset; this tool only makes the
  # Android ones.
  ios: false
  image_path_ios: "assets_src/icon/icon-1024.png"
  remove_alpha_ios: true
  android: "ic_launcher"
  image_path_android: "assets_src/icon/icon-1024-rounded.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets_src/icon/adaptive-background.png"
  adaptive_icon_foreground: "assets_src/icon/adaptive-foreground.png"
  adaptive_icon_monochrome: "assets_src/icon/adaptive-monochrome.png"
  adaptive_icon_foreground_inset: 0
