version: 2
updates:
  - package-ecosystem: pub
    directories: [/app, /app/packages/peel_native]
    schedule:
      interval: monthly
    groups:
      pub:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
