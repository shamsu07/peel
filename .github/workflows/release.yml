# Builds a signed Android APK and bundle when a version tag is pushed
# (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and attaches them to a
# GitHub release. Needs these repository secrets (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional:
#   VERCEL_DEPLOY_HOOK        a Vercel deploy hook URL, so the website
#                             picks up the new version and size at once
#
# The APK is always attached as peel.apk, so
# https://github.com/shamsu07/peel/releases/latest/download/peel.apk
# (where the website's download button points) is always the newest.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Android signing secrets are missing. See .github/workflows/release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - name: Build
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols/apk
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/aab
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/peel.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/peel-${GITHUB_REF_NAME}.aab"
          tar -czf "$RUNNER_TEMP/peel-${GITHUB_REF_NAME}-symbols.tar.gz" build/symbols
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "Peel $GITHUB_REF_NAME" \
            "$RUNNER_TEMP/peel.apk#Android app (arm64)" \
            "$RUNNER_TEMP/peel-${GITHUB_REF_NAME}.aab" \
            "$RUNNER_TEMP/peel-${GITHUB_REF_NAME}-symbols.tar.gz"
      - name: Refresh the website
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null; else echo "No VERCEL_DEPLOY_HOOK; the site updates on its next deploy."; fi
      - name: Clean up the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
