name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tap …
        2. Pick a video …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Peel version
      description: Settings → About → Version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and OS
      placeholder: Pixel 8, Android 16 / iPhone 15, iOS 26.1
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or recordings
      description: Leave out anything personal.
