name: Idea
description: Suggest something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or moment it's for, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
